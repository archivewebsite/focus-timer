<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple, minimal, and aesthetic focus timer with recommended focus and break durations."
    />
    <title>Focus Timer</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect width='256' height='256' rx='56' fill='%23111827'/%3E%3Ccircle cx='128' cy='128' r='82' fill='none' stroke='white' stroke-width='18'/%3E%3Cpath d='M128 76v58l38 22' fill='none' stroke='white' stroke-width='18' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <div class="brand">
          <div class="brand-icon" data-icon="clock" aria-hidden="true"></div>
          <div>
            <h1>Focus Timer</h1>
            <div class="subtitle">Focus. Break. Repeat.</div>
          </div>
        </div>
        <div class="pill" id="duration-pill">25m / 5m</div>
      </header>

      <div class="layout">
        <section class="timer-card" aria-label="Focus timer">
          <div class="mode-row">
            <button class="mode-button active" id="focus-mode" type="button">
              <span data-icon="brain" aria-hidden="true"></span>
              Focus
            </button>
            <button class="mode-button" id="break-mode" type="button">
              <span data-icon="coffee" aria-hidden="true"></span>
              Break
            </button>
          </div>

          <div class="timer-ring" id="timer-ring">
            <div class="timer-content">
              <div class="mode-label" id="mode-label">
                <span data-icon="brain" aria-hidden="true"></span>
                <span id="mode-label-text">Focus</span>
              </div>
              <div class="time" id="time">25:00</div>
              <div class="timer-preset" id="timer-preset">Classic Pomodoro</div>
            </div>
          </div>

          <div class="controls">
            <button class="primary-button" id="start-pause" type="button">
              <span data-icon="play" aria-hidden="true"></span>
              <span id="start-pause-text">Start</span>
            </button>
            <button class="icon-button" id="reset" type="button" aria-label="Reset timer">
              <span data-icon="reset" aria-hidden="true"></span>
            </button>
            <button class="icon-button" id="skip" type="button" aria-label="Switch mode">
              <span data-icon="skip" aria-hidden="true"></span>
            </button>
          </div>
        </section>

        <section class="presets" id="presets" aria-label="Timer presets"></section>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
